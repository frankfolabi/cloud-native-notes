# ============================================
# Secret using stringData (human-readable)
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: cloud-native-notes
type: Opaque
stringData:
  REDIS_PASSWORD: "my-secure-redis-password"
---
# ============================================
# Secret using data (base64-encoded)
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret-base64
  namespace: cloud-native-notes
type: Opaque
data:
  REDIS_PASSWORD: bXktc2VjdXJlLXJlZGlzLXBhc3N3b3Jk

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-notes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.192-168-0-128.nip.io/frankfolabi/cloud-native-notes.git  # Change this URL to point to your git repo
    targetRevision: HEAD
    path: week8/k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-native-notes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
